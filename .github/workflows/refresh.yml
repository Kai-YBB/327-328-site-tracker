# Weekly refresh of the site list.
#
# Runs scripts/build_data.py, which pulls the latest Boston, Cambridge and
# Somerville open data and saves data/sites.json. GitHub Pages republishes the
# site on its own after every commit.
#
# Every run, pass or fail, also saves data/refresh_status.json with the result
# and the end of the log. The weekly maintenance task reads that file to see
# whether the script needs fixing (see WEEKLY_TASK.md).
#
# If a source is down or returns broken data, the script stops before writing,
# so the site keeps last week's data.

name: Refresh site data

on:
  schedule:
    - cron: "17 10 * * 1"        # Mondays 10:17 UTC (6:17 AM Boston in summer, 5:17 AM in winter)
  workflow_dispatch: {}           # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths:                        # re-test right away when the script or this file changes
      - "scripts/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data/sites.json from live open data
        id: build
        run: |
          set -o pipefail
          python3 scripts/build_data.py 2>&1 | tee build.log

      - name: Save run result to data/refresh_status.json
        if: always()
        env:
          RESULT: ${{ steps.build.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, datetime
          log = open("build.log").read() if os.path.exists("build.log") else ""
          status = {
              "result": "ok" if os.environ["RESULT"] == "success" else "failed",
              "ranAt": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "trigger": os.environ["TRIGGER"],
              "runUrl": os.environ["RUN_URL"],
              "logTail": log[-4000:],
          }
          json.dump(status, open("data/refresh_status.json", "w"), indent=2)
          print(json.dumps({k: v for k, v in status.items() if k != "logTail"}))
          PY

      - name: Commit results
        if: always()
        run: |
          git config user.name "site-data-bot"
          git config user.email "site-data-bot@users.noreply.github.com"
          git add data/refresh_status.json
          if [ "${{ steps.build.outcome }}" = "success" ]; then git add data/sites.json; fi
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git commit -m "Site data refresh $(date -u +%Y-%m-%d): ${{ steps.build.outcome }}"
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push && exit 0
            sleep 5
          done
          exit 1
