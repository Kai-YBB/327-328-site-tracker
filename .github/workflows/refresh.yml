# Weekly refresh of the site list.
# Runs scripts/build_data.py, which pulls the latest Boston, Cambridge and
# Somerville open data. If the data changed, it commits data/sites.json and
# GitHub Pages republishes the site on its own.
# If a source is down or returns broken data, the script stops, nothing is
# committed, and this run shows as failed. The weekly Claude maintenance task
# checks for failed runs and fixes the script (see MAINTENANCE.md).

name: Refresh site data

on:
  schedule:
    - cron: "17 10 * * 1"   # Mondays, 10:17 UTC (6:17 AM Boston time in summer, 5:17 AM in winter)
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data/sites.json from live open data
        run: python3 scripts/build_data.py

      - name: Commit if the data changed
        run: |
          if git diff --quiet -- data/sites.json; then
            echo "No changes this week."
            exit 0
          fi
          git config user.name "site-data-bot"
          git config user.email "site-data-bot@users.noreply.github.com"
          git add data/sites.json
          git commit -m "Weekly site data refresh $(date -u +%Y-%m-%d)"
          git push
